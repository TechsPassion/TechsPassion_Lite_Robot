<text x="1112.5" y="436" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#111827">SSD1306 OLED</text>
<text x="1112.5" y="454" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#4b5563">0.96" I²C, address 0x3C</text>
<text x="997" y="471" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#16a34a">SDA</text>
<text x="997" y="503" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#16a34a">SCL</text>
<text x="1228" y="519" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#374151">VCC → 3.3V or 5V</text>
<text x="1228" y="536" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#374151">GND → GND</text>
<line x1="20" y1="618" x2="1260" y2="618" stroke="#e5e7eb" stroke-width="2"/>
<text x="20" y="644" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#111827">Notes</text>
<circle cx="28" cy="665" r="3.5" fill="#6b7280"/>
<text x="40" y="670" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1f2937">Both motors on each side share one channel: the two A1 sockets (left) and the two B1 sockets (right) are wired in parallel inside the driver.</text>
<circle cx="28" cy="695" r="3.5" fill="#6b7280"/>
<text x="40" y="700" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1f2937">The driver is powered by the 18650 batteries (VIN) and supplies 5V to the ESP32. Connect all GNDs together (driver, ESP32, sensor, servo, OLED).</text>
<circle cx="28" cy="725" r="3.5" fill="#6b7280"/>
<text x="40" y="730" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1f2937">HC-SR04 and servo run on 5V. Most SSD1306 OLED modules accept 3.3V or 5V; check yours. The servo's orange wire is the signal.</text>
<circle cx="28" cy="755" r="3.5" fill="#6b7280"/>
<text x="40" y="760" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1f2937">HC-SR04 ECHO outputs 5V, while ESP32-S3 pins are 3.3V. A 1 kΩ / 2 kΩ voltage divider on ECHO is the safe way to connect it.</text>
<circle cx="28" cy="785" r="3.5" fill="#6b7280"/>
<text x="40" y="790" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1f2937">Don't use GPIO 35–37 (PSRAM) or GPIO 43–44 (serial port). A servo on GPIO 44 causes a boot loop.</text>
<line x1="20" y1="832" x2="48" y2="832" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
<text x="56" y="837" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">Left motors</text>
<line x1="167.4" y1="832" x2="195.4" y2="832" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
