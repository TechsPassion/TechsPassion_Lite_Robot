<text x="1112.5" y="332" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#4b5563">pans the sensor and camera</text>
<text x="997" y="357" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#ea580c">Signal</text>
