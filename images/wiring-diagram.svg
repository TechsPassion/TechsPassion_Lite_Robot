<line x1="322.20000000000005" y1="832" x2="350.20000000000005" y2="832" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
<text x="358.20000000000005" y="837" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">5V / battery +</text>
<line x1="491.80000000000007" y1="832" x2="519.8000000000001" y2="832" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
<text x="527.8000000000001" y="837" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">Ground</text>
<line x1="602.2" y1="832" x2="630.2" y2="832" stroke="#0d9488" stroke-width="4" stroke-linecap="round"/>
<text x="638.2" y="837" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">Ultrasonic</text>
<line x1="742.2" y1="832" x2="770.2" y2="832" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/>
<text x="778.2" y="837" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">Servo</text>
<line x1="845.2" y1="832" x2="873.2" y2="832" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
